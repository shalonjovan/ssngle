<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Video Connection</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <header>
            <h1>WebRTC Test</h1>
            <p>A modern peer-to-peer video connection</p>
        </header>

        <div class="video-container">
            <div class="video-wrapper">
                <h2>Local Video</h2>
                <video id="localVideo" autoplay muted playsinline></video>
            </div>
            <div class="video-wrapper">
                <h2>Remote Video</h2>
                <video id="remoteVideo" autoplay playsinline></video>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" onclick="createOffer()">Create Offer</button>
            <button class="btn btn-secondary" onclick="createAnswer()">Create Answer</button>
            <button class="btn btn-success" onclick="acceptAnswer()">Accept Answer</button>
        </div>

        <div class="signal-container">
            <label for="signalData">Signal Data Exchange</label>
            <textarea id="signalData" placeholder="SDP exchange data will appear here..."></textarea>
        </div>

        <script>

            let localStream;
            let peer;

            async function startCamera() {

                localStream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: true
                });

                document.getElementById("localVideo").srcObject = localStream;

                peer = new RTCPeerConnection({
                    iceServers: [
                        { urls: "stun:stun.l.google.com:19302" }
                    ]
                });

                localStream.getTracks().forEach(track => {
                    peer.addTrack(track, localStream);
                });

                peer.ontrack = (event) => {
                    document.getElementById("remoteVideo").srcObject = event.streams[0];
                };

                peer.onicecandidate = (event) => {
                    if (event.candidate === null) {
                        document.getElementById("signalData").value =
                            JSON.stringify(peer.localDescription);
                    }
                };
            }

            async function createOffer() {

                await startCamera();

                const offer = await peer.createOffer();

                await peer.setLocalDescription(offer);
            }

            async function createAnswer() {

                await startCamera();

                const offer = JSON.parse(document.getElementById("signalData").value);

                await peer.setRemoteDescription(offer);

                const answer = await peer.createAnswer();

                await peer.setLocalDescription(answer);
            }

            async function acceptAnswer() {

                const answer = JSON.parse(document.getElementById("signalData").value);

                await peer.setRemoteDescription(answer);
            }

            window.acceptAnswer = acceptAnswer;

        </script>

    </div>

</body>

</html>
