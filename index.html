<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Video Connection</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
<header>
<h1>WebRTC Test</h1>
<p>A modern peer-to-peer video connection</p>
</header>

<div class="video-container">

<div class="video-wrapper">
<h2>Local Video</h2>
<video id="localVideo" autoplay muted playsinline></video>
</div>

<div class="video-wrapper">
<h2>Remote Video</h2>
<video id="remoteVideo" autoplay playsinline></video>
</div>

</div>

<div class="controls">
<button class="btn btn-primary" onclick="createOffer()">Create Offer</button>
<button class="btn btn-secondary" onclick="createAnswer()">Create Answer</button>
<button class="btn btn-success" onclick="acceptAnswer()">Accept Answer</button>
</div>

<div class="signal-container">
<label for="signalData">Signal Data Exchange</label>
<textarea id="signalData" placeholder="SDP exchange data will appear here..."></textarea>
</div>

</div>

<script src="script.js"></script>

</body>
</html>
