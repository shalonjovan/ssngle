<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SSNgle</title>
  <link rel="icon" href="/static/favicon.ico">
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

<header>
  <div class="logo">SSN<span>gle</span></div>
  <div class="online-count" id="onlineCount">0 online</div>
  <div class="status-pill idle" id="status-pill">IDLE</div>
</header>

<div id="home" class="home">
  <div class="home-box">
    <div class="home-logo">SSN<span>gle</span></div>
    <p class="home-tagline">Talk to strangers. Pick your vibe.</p>
    <div class="home-actions">
      <button id="startVideo" class="btn btn-video">Video Chat</button>
      <button id="startText" class="btn btn-text">Text Chat</button>
    </div>
    <p class="home-note">No signup. Random matching. One stranger at a time.</p>
  </div>
</div>

<div class="chat-screen" id="videoMode" style="display:none">

  <div class="videos-wrapper">

    <div class="video-box" data-label="YOU">
      <video id="localVideo" autoplay muted playsinline></video>
      <div class="placeholder hidden" id="local-placeholder">
        <span class="icon">🎥</span>
        <span>Camera off</span>
      </div>
    </div>

    <div class="video-box" data-label="STRANGER">
      <video id="remoteVideo" autoplay playsinline></video>
      <div class="placeholder" id="remote-placeholder">
        <div class="spinner" id="remote-spinner"></div>
        <span id="remote-label">Connecting...</span>
      </div>
    </div>

  </div>

  <div class="controls">
    <button id="videoHomeBtn" class="btn btn-ghost">Home</button>
    <button id="chatBtn" class="btn btn-chat">Chat</button>
    <button id="skipBtn" class="btn btn-skip">Skip →</button>
  </div>

</div>

<div class="chat-screen" id="textMode" style="display:none">

  <div class="text-chat">
    <div class="text-chat-header" id="textLabel">Connecting…</div>
    <div id="textMessages" class="chat-messages"></div>
    <form id="textForm" class="chat-input" autocomplete="off">
      <input id="textInput" type="text" placeholder="Say something…" maxlength="500" />
      <button type="submit" class="chat-send">Send</button>
    </form>
  </div>

  <div class="controls">
    <button id="textHomeBtn" class="btn btn-ghost">Home</button>
    <button id="textSkipBtn" class="btn btn-skip">Skip →</button>
  </div>

</div>

<div id="chatPanel" class="chat-panel hidden">
  <div class="chat-header">
    <span>Chat</span>
    <button id="chatCloseBtn" class="chat-close" aria-label="Close chat">&times;</button>
  </div>
  <div id="chatMessages" class="chat-messages"></div>
  <form id="chatForm" class="chat-input" autocomplete="off">
    <input id="chatInput" type="text" placeholder="Say something…" maxlength="500" />
    <button type="submit" class="chat-send">Send</button>
  </form>
</div>

<div id="toast"></div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="/static/script.js"></script>
</body>
</html>
