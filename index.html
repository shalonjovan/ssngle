<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SSNgle</title>
  <link rel="icon" href="/static/favicon.ico">
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

<header>
  <div class="logo">SSN<span>gle</span></div>
  <div class="online-count" id="onlineCount">0 online</div>
  <div class="status-pill idle" id="status-pill">IDLE</div>
</header>

<div class="chat-screen">

  <div class="videos-wrapper">

    <div class="video-box" data-label="YOU">
      <video id="localVideo" autoplay muted playsinline></video>
      <div class="placeholder hidden" id="local-placeholder">
        <span class="icon">🎥</span>
        <span>Camera off</span>
      </div>
    </div>

    <div class="video-box" data-label="STRANGER">
      <video id="remoteVideo" autoplay playsinline></video>
      <div class="placeholder" id="remote-placeholder">
        <div class="spinner" id="remote-spinner"></div>
        <span id="remote-label">Connecting...</span>
      </div>
    </div>

  </div>

  <div class="controls">
    <button id="skipBtn" class="btn btn-skip">Skip →</button>
  </div>

</div>

<div id="toast"></div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="/static/script.js"></script>

<script>
  function setStatus(text, cls) {
    const el = document.getElementById('status-pill');
    el.textContent = text;
    el.className = 'status-pill ' + cls;
  }

  function showToast(msg, duration = 2500) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), duration);
  }

  function setRemotePlaceholder(show, spinning = false, text = '') {
    const ph  = document.getElementById('remote-placeholder');
    const sp  = document.getElementById('remote-spinner');
    const lb  = document.getElementById('remote-label');
    ph.classList.toggle('hidden', !show);
    sp.style.display = spinning ? 'block' : 'none';
    lb.textContent = text;
    document.getElementById('remoteVideo').style.opacity = show ? '0' : '1';
  }

  window.addEventListener('load', () => {
    setStatus('SEARCHING…', 'waiting');
    setRemotePlaceholder(true, true, 'Finding a stranger…');

    socket.on('match_found', () => {
      setStatus('CONNECTED', 'chatting');
      setRemotePlaceholder(true, true, 'Connecting video…');
      showToast('Stranger found!');
    });

    const onlineCount = document.getElementById("onlineCount");
    socket.on("online_count", data => {
        console.log("Online users:", data.count);
        onlineCount.textContent = `${data.count} online`;
    });

    socket.on('skip', () => {
      setStatus('SEARCHING…', 'waiting');
      setRemotePlaceholder(true, true, 'Finding next stranger…');
      showToast('Stranger disconnected');
    });

    document.getElementById('remoteVideo').addEventListener('playing', () => {
      setRemotePlaceholder(false);
      setStatus('CONNECTED', 'chatting');
    });

    document.getElementById('localVideo').addEventListener('playing', () => {
      document.getElementById('local-placeholder').classList.add('hidden');
    });

    document.getElementById('skipBtn').addEventListener('click', () => {
      setStatus('SEARCHING…', 'waiting');
      setRemotePlaceholder(true, true, 'Finding next stranger…');
      showToast('⏭ Skipped');
    });
  });
</script>

</body>
</html>
